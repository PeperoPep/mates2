# Logitech MX Keys / MX Keys S -- action keys
#
# This is a template. install/hardware/logitech-mx-keys.sh copies it to
# /etc/keyd/logitech-mx-keys.conf when it detects either keyboard, prepending an
# [ids] section built from the detector's output -- the receiver id when an
# MX Keys S is on the Bolt receiver, the keyboard's own id on Bluetooth or
# behind a Unifying receiver, so keyd never grabs a receiver that only some
# other keyboard uses. The installed file's presence also gates the Hyprland
# binds in default/hypr/bindings/logitech-mx-keys.lua.
#
# Only the MX Keys S action row (emoji, screenshot, dictation, mic mute, lock)
# sends fixed chords meant for Logi Options+. There is no Options+ on Linux, so
# keyd rewrites those chords to spare F14-F17 keycodes (the MX Keys S mic-mute
# key already emits a bare F13). Hyprland binds them by keycode (code:191..195),
# so they work regardless of keymap. No existing Omarchy shortcut changes:
# F13-F24 are otherwise unused, and a keyd binding is unaffected by the
# modifiers of the layer it sits in (see keyd(1)), so each chord below produces
# a clean F-key while every other key and combination passes through untouched.
#
# The MX Keys (non-S) has no action row of its own. Its ordinary Super+A and
# Super+D chords are real user shortcuts there, same as on any other keyboard,
# so this file leaves them untouched rather than assuming they are unused.
#
# Behind the Bolt receiver the id keyd grabs is the receiver's, shared with
# anything else paired to it (e.g. an MX Master). The k: prefix limits the grab
# to keyboard interfaces, so a co-paired mouse keeps working; its unmapped keys
# pass through. A Unifying receiver hands each device its own product id, so the
# grab there is the MX Keys alone.

[meta]
h = f16
l = f17

[meta+shift]
s = f15

[meta+control+alt+shift]
space = f14
